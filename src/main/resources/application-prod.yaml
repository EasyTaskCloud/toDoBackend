server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${RDS_ENDPOINT}:5432/easytaskdb
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  flyway:
    locations:
      db/migration/common
      db/migration/prod
    clean-disabled: true

logging:
  level:
    root: INFO

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS}"
    allowed-methods: "GET,POST,PUT,DELETE"
